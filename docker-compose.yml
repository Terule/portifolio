services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portifolio-app
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-replace-with-32-char-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      DATABASE_URL: postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-portifolio}
      DATABASE_USER: ${DATABASE_USER:-portifolio}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-portifolio}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-portfolio-assets}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-seaweedfs}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-seaweedfs-secret}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: portifolio-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-portifolio}
      POSTGRES_USER: ${DATABASE_USER:-portifolio}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-portifolio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-portifolio} -d ${DATABASE_NAME:-portifolio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: "server -dir=/data -filer -s3 -s3.port=8333"
    expose:
      - "8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped


volumes:
  postgres_data:
  seaweedfs_data:
